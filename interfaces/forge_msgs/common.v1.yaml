version: 1
package: forge_msgs
domain: common

conventions:
  timing:
    source: dora_event
    payload_timestamp: omitted
    derived_output: preserve_explicit_source_sample_time_when_describing_that_sample
    native_dora_timestamp: regenerated_on_node_publish_not_source_sample_time
    runtime_latency: ../observability/PROTOCOL.md
  spatial_context:
    source: node_configuration_or_dora_metadata
    payload_frame_id: omitted
  result_sets:
    empty_result: empty_lists
  numeric:
    joint_scalar: float64
    image_dimension: uint32
  joints:
    revolute:
      position: radians
      velocity: radians_per_second
      effort: newton_meter
    prismatic:
      position: meter
      velocity: meter_per_second
      effort: newton
  image:
    byte_order: little_endian
    coordinate_system:
      origin: top_left
      x_axis: right
      y_axis: down
      unit: pixel
    compressed_formats:
      - jpeg
      - png
      - webp
    encodings:
      rgb8:
        channels: 3
        scalar: uint8
        bytes_per_pixel: 3
      bgr8:
        channels: 3
        scalar: uint8
        bytes_per_pixel: 3
      mono8:
        channels: 1
        scalar: uint8
        bytes_per_pixel: 1
      8UC1:
        channels: 1
        scalar: uint8
        bytes_per_pixel: 1
      16UC1:
        channels: 1
        scalar: uint16
        bytes_per_pixel: 2
      32SC1:
        channels: 1
        scalar: int32
        bytes_per_pixel: 4
      32FC1:
        channels: 1
        scalar: float32
        bytes_per_pixel: 4
  audio:
    byte_order: little_endian
    layout: interleaved_by_frame
    sample_formats:
      f32le:
        scalar: float32
        bytes_per_sample: 4
        recommended_range:
          minimum: -1.0
          maximum: 1.0
      s16le:
        scalar: int16
        bytes_per_sample: 2
