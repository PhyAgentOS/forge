name: Release line checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check_release_line.py'
      - 'scripts/test_release_line.py'
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/check_release_line.py'
      - 'scripts/test_release_line.py'
permissions:
  contents: read
jobs:
  release-line-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test source selection, versions and Forge/Dora compatibility
        run: python -m unittest discover -s scripts -p test_release_line.py -v
