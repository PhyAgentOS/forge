[package]
name = "forge_msgs"
version = "2.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust message types and Arrow serialization for Forge robotics dataflows."
readme = "README.md"

[lib]
name = "forge_msgs"
path = "src/lib.rs"

[dependencies]
arrow-array = "59.1"
arrow-schema = "59.1"
bytes = "1.10.0"
ndarray = "0.17.2"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
serde = "1.0"
serde_json = "1.0"

