[package]
name = "forgelab_common"
version = "2.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared Rust logging and observability utilities for Forge crates."
readme = "README.md"

[lib]
name = "forge_common"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
